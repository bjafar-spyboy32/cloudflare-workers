name = "cloudflare-workers"
main = "src/index.js"
compatibility_date = "2026-09-27"
# Replace with your Cloudflare Account ID (find it in the Cloudflare dashboard)
# account_id = "your_account_id_here"
workers_dev = true
# To publish to a custom route, set `route` and `zone_id` or configure an env.
# route = "example.com/*"
# zone_id = "your_zone_id_here"

[build]
command = "npm install && npm run build"

[env.production]
workers_dev = false
# route = "example.com/*"
# zone_id = "your_zone_id_here"
